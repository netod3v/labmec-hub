<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nova senha · LABIOMEC Hub</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/password-reset.css">
  <script src="/lab-config.js"></script>
  <script type="module" src="/assets/password-reset.js"></script>
</head>
<body>
  <main>
    <span class="eyebrow">LABIOMEC HUB</span>
    <h1 id="reset-heading">Verifique seu e-mail</h1>
    <p id="reset-description">Informe seu e-mail e o código de 6 dígitos recebido. O código vale por 10 minutos.</p>
    <form id="code-form">
      <label for="reset-email">E-mail da conta</label>
      <input id="reset-email" type="email" autocomplete="email" maxlength="254" required>
      <label for="reset-code">Código de verificação</label>
      <input id="reset-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
      <button type="submit" id="code-submit">Verificar código</button>
      <button type="button" id="resend-code">Enviar novo código</button>
    </form>
    <form id="reset-form" hidden>
      <label for="new-password">Nova senha</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
      <label for="confirm-password">Confirmar nova senha</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
      <label class="show-password"><input id="show-password" type="checkbox"> Mostrar senhas</label>
      <button type="submit" id="reset-submit">Salvar nova senha</button>
    </form>
    <p id="reset-status" role="status" aria-live="polite"></p>
    <a class="back" href="/">Voltar para entrar no Hub</a>
  </main>
</body>
</html>

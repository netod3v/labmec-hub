<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nova senha · LABIOMEC Hub</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/password-reset.css">
  <script src="/lab-config.js"></script>
  <script type="module" src="/assets/password-reset.js"></script>
</head>
<body>
  <main>
    <span class="eyebrow">LABIOMEC HUB</span>
    <h1>Escolha sua nova senha</h1>
    <p>Crie uma senha com pelo menos 12 caracteres. Após salvar, entre novamente no Hub.</p>
    <form id="reset-form">
      <label for="new-password">Nova senha</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
      <label for="confirm-password">Confirmar nova senha</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
      <label class="show-password"><input id="show-password" type="checkbox"> Mostrar senhas</label>
      <button type="submit" id="reset-submit">Salvar nova senha</button>
    </form>
    <p id="reset-status" role="status" aria-live="polite"></p>
    <a class="back" href="/">Voltar para entrar no Hub</a>
  </main>
</body>
</html>

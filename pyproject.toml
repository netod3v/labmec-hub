    "blinker==1.9.0",
    "click==8.3.1",
    "Flask==3.1.3",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "psycopg-binary==3.3.6",
